name: Proselint

on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  proselint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Proselint
        run: pip install proselint

      - name: Run Proselint on all .md files
        run: |
          find . -name "*.md" -print0 | xargs -0 proselint
